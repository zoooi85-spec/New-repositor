name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o project.zip -d app_project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
        working-directory: app_project
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: app_project/app/build/outputs/apk/debug/app-debug.apk
